<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" media="(prefers-color-scheme: light)" href="/Kormiis%20favicon%20Light%20Mode.svg" />
    <link rel="icon" type="image/svg+xml" media="(prefers-color-scheme: dark)" href="/Kormiis%20favicon%20Dark%20Mode..svg" />
    <link rel="apple-touch-icon" href="/Kormiis%20Monogram%20Logo%20180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F8F9FA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#090a0f" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" />
    <script>
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        window.onerror = function(msg, url, line, col, error) {
          fetch('http://localhost:9999/log', { method: 'POST', body: JSON.stringify({type: 'error', msg, url, line, col, stack: error ? error.stack : ''}) });
        };
        const oldConsoleError = console.error;
        console.error = function(...args) {
          fetch('http://localhost:9999/log', { method: 'POST', body: JSON.stringify({type: 'console.error', args}) });
          oldConsoleError.apply(console, args);
        };
      }
    </script>
    <script>
      // Capture PWA install prompt as early as possible
      window.deferredPWAInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPWAInstallPrompt = e;
        window.dispatchEvent(new Event('pwa-installable'));
      });
    </script>
    <title>Kormiis</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
