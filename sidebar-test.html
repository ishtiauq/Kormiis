<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script type="module" src="/src/index.css"></script>
    <style>
      .stage { position: relative; height: 560px; border-radius: 24px; overflow: hidden; }
      .stage-inner { position: absolute; inset: 0; padding: 24px 24px 24px 90px; display: flex; flex-direction: column; gap: 14px; }
      .fake-card { border-radius: 20px; padding: 16px; font-family: sans-serif; }
      .label { position: absolute; z-index: 60; bottom: 6px; left: 8px; font: 600 11px sans-serif; color: #FE3501; }
    </style>
  </head>
  <body>
    <!-- LIGHT -->
    <section style="padding:20px;">
      <div class="stage">
        <div class="stage-inner">
          <div class="fake-card bg-card border shadow-sm" style="height:120px;">bg-card reference</div>
          <div style="display:flex; gap:14px; align-items:center;">
            <div class="topbar" style="width:220px; height:52px;"></div>
            <div class="fake-card" style="background:linear-gradient(135deg,#fda4af,#a78bfa); width:180px; height:80px;">colorful</div>
            <div class="fake-card" style="background:#FE3501; width:140px; height:80px;"></div>
          </div>
          <div class="fake-card bg-card border" style="height:160px;">more content behind</div>
        </div>
        <!-- collapsed sidebar replica -->
        <aside class="flex flex-col glass-kormiis text-sidebar-foreground shadow-2xl overflow-hidden w-[52px] h-auto p-1.5 py-2.5 rounded-3xl shadow-xl" style="position:absolute; top:50%; transform:translateY(-50%); left:12px; z-index:50;">
          <nav class="flex-1 w-full flex flex-col gap-1.5 items-center justify-center">
            <div class="size-9 rounded-2xl flex items-center justify-center text-sidebar-foreground/75">A</div>
            <div class="size-9 rounded-2xl flex items-center justify-center nav-capsule-active font-semibold">B</div>
          </nav>
        </aside>
        <!-- expanded sidebar replica -->
        <aside class="flex flex-col glass-kormiis text-sidebar-foreground shadow-2xl overflow-hidden w-[196px] p-2.5 pt-3 pb-2.5 rounded-3xl shadow-2xl" style="position:absolute; top:50%; transform:translateY(-50%); left:84px; z-index:50; height:min(calc(100%_-_2rem),510px);">
          <nav class="flex-1 w-full flex flex-col gap-1.5">
            <div class="h-10 rounded-2xl px-3 flex items-center gap-3 nav-capsule-active font-semibold">Active item</div>
            <div class="h-10 rounded-2xl px-3 flex items-center gap-3 text-sidebar-foreground/75">Item two</div>
            <div class="h-10 rounded-2xl px-3 flex items-center gap-3 text-sidebar-foreground/75">Item three</div>
          </nav>
        </aside>
        <span class="label">LIGHT</span>
      </div>
    </section>

    <!-- DARK -->
    <section class="dark" style="padding:20px; background:#000;">
      <div class="stage">
        <div class="stage-inner">
          <div class="fake-card bg-card border shadow-sm" style="height:120px;">bg-card reference</div>
          <div style="display:flex; gap:14px; align-items:center;">
            <div class="topbar" style="width:220px; height:52px;"></div>
            <div class="fake-card" style="background:linear-gradient(135deg,#fda4af,#a78bfa); width:180px; height:80px;">colorful</div>
            <div class="fake-card" style="background:#FE3501; width:140px; height:80px;"></div>
          </div>
          <div class="fake-card bg-card border" style="height:160px;">more content behind</div>
        </div>
        <aside class="flex flex-col glass-kormiis text-sidebar-foreground shadow-2xl overflow-hidden w-[52px] h-auto p-1.5 py-2.5 rounded-3xl shadow-xl" style="position:absolute; top:50%; transform:translateY(-50%); left:12px; z-index:50;">
          <nav class="flex-1 w-full flex flex-col gap-1.5 items-center justify-center">
            <div class="size-9 rounded-2xl flex items-center justify-center text-sidebar-foreground/75">A</div>
            <div class="size-9 rounded-2xl flex items-center justify-center nav-capsule-active font-semibold">B</div>
          </nav>
        </aside>
        <aside class="flex flex-col glass-kormiis text-sidebar-foreground shadow-2xl overflow-hidden w-[196px] p-2.5 pt-3 pb-2.5 rounded-3xl shadow-2xl" style="position:absolute; top:50%; transform:translateY(-50%); left:84px; z-index:50; height:min(calc(100%_-_2rem),510px);">
          <nav class="flex-1 w-full flex flex-col gap-1.5">
            <div class="h-10 rounded-2xl px-3 flex items-center gap-3 nav-capsule-active font-semibold">Active item</div>
            <div class="h-10 rounded-2xl px-3 flex items-center gap-3 text-sidebar-foreground/75">Item two</div>
            <div class="h-10 rounded-2xl px-3 flex items-center gap-3 text-sidebar-foreground/75">Item three</div>
          </nav>
        </aside>
        <span class="label" style="color:#fff;">DARK</span>
      </div>
    </section>
  </body>
</html>
